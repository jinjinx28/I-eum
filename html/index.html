<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전지원 포털 - 피해 지원 서비스</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>피해자 안전지원 포털</h1>
    </header>

    <main>
        <section class="step">
            <h2>범죄 유형 선택</h2>
            <div class="options">
                <button>스토킹</button>
                <button>사이버 범죄</button>
                <button>기타</button>
            </div>
        </section>

        <section class="step">
            <h2>증거 체크리스트</h2>
            <div class="checklist">
                <label><input type="checkbox"> 문자/메신저 캡처본</label>
                <label><input type="checkbox"> 통화 녹취록</label>
                <label><input type="checkbox"> 사진/영상 증거</label>
            </div>
        </section>

        <section class="step">
            <h2>진술 작성</h2>
            <textarea placeholder="현재 상황을 간략하게 적어주세요."></textarea>
            <button class="submit-btn">저장하기</button>
        </section>

        <section class="step">
            <h2>AI 챗봇</h2>
            <button class="submit-btn">상담하기</button>
        </section>
    </main>
</body>
</html>
