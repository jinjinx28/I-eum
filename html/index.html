<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전지원 포털 - 피해 지원 서비스</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="img/favicon.ico" type="img/x-icon">
</head>
<body>
    <header class="header">
        <div>
            <h1>이음 (I - eum)</h1>
        </div>
        <nav>
            <ul class="header-menu">
                <li><a href="#" class="header-menu-item">홈</a></li>
                <li><a href="#" class="header-menu-item">범죄 유형</a></li>
                <li><a href="#" class="header-menu-item">증거리스트</a></li>
                <li><a href="#" class="header-menu-item">AI챗봇</a></li>
            </ul>
        </nav>
        <button class="header-toggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main>
        <section class="home">
            <h2 class="home-title">
                <strong>안전한 일상 회복을 위한 대응 가이드</strong> 
                <br>
                <p class="home-description">범죄 피해 대응에 필요한 필수 자료를 정리하고 지원 기관을 연결해 드립니다.</p>
            </h2>
            <a class="home-contact" href="#">contact</a>
        </section>

        <section class="step">
            <h2>증거 체크리스트</h2>
            <div class="checklist">
                <label><input type="checkbox"> 문자/메신저 캡처본</label>
                <label><input type="checkbox"> 통화 녹취록</label>
                <label><input type="checkbox"> 사진/영상 증거</label>
            </div>
        </section>

        <section class="step">
            <h2>진술 작성</h2>
            <textarea placeholder="현재 상황을 간략하게 적어주세요."></textarea>
            <button class="submit-btn">저장하기</button>
        </section>

        <section class="step">
            <h2>AI 챗봇</h2>
            <button class="submit-btn">상담하기</button>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
