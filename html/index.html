<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전지원 포털 - 피해 지원 서비스</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="header">
        <div class="header-container">
            
            <nav class="nav-left">
                <ul class="header-menu">
                    <li><a href="#" class="header-menu-item">범죄 유형</a></li>
                    <li><a href="#" class="header-menu-item">증거리스트</a></li>
                    <li><a href="#" class="header-menu-item">AI 챗봇</a></li>
                </ul>
            </nav>

            <h1 class="logo"><a href="#">I - eum</a></h1>
            
            <nav class="nav-right">
                <ul class="header-menu">
                    <li><a href="#" class="header-menu-item">홈</a></li>
                    <li><a href="#" class="header-menu-item">로그인</a></li>
                    <li><a href="#" class="header-menu-item">회원가입</a></li>
                </ul>
            </nav>
            
            <button class="header-toggle"><i class="fa-solid fa-bars"></i></button>

        </div>
    </header>

    <main class="main-content">
        <section class="home">
            <div class="home-content">
                <h2 class="home-title">안전한 일상 회복을 위한 대응 가이드</h2> 
                <p class="home-description">범죄 피해 대응에 필요한 필수 자료를 정리하고 지원 기관을 연결해 드립니다.</p>
                <a class="home-contact" href="#">Contact Us</a>
            </div>
        </section>

        <section class="step">
            <h2><i class="fa-solid fa-square-check"></i> 증거 체크리스트</h2>
            <div class="checklist">
                <label><input type="checkbox"> 메신저 캡처본</label>
                <label><input type="checkbox"> 통화 녹취록</label>
                <label><input type="checkbox"> 사진 / 영상 증거</label>
            </div>
        </section>

        <section class="step">
            <h2><i class="fa-solid fa-pen-to-square"></i> 진술 작성</h2>
            <textarea placeholder="현재 상황을 세세하게 적어주세요."></textarea>
            <div class="btn-container">
                <button class="submit-btn save-btn">저장하기</button>
            </div>
        </section>

        <section class="step chatbot-section">
            <h2><i class="fa-solid fa-robot"></i> AI 챗봇 상담</h2>
            <p class="section-desc">전문 AI가 24시간 실시간으로 초기 대응 방법을 안내해 드립니다.</p>
            <div class="btn-container">
                <button class="submit-btn chat-btn">상담하기</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 이음 (I-eum) 안전지원 포털. All rights reserved.</p>
    </footer>
</body>
</html>
